<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silicon WorkMate - Update Toolset</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #FAFAFA;
        }
    </style>
</head>
<body class="h-screen flex overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-[200px] bg-white border-r border-gray-200 flex flex-col flex-shrink-0">
        <!-- Logo -->
        <div class="h-16 flex items-center px-6 border-b border-gray-100 flex-shrink-0">
            <div class="flex items-center font-extrabold tracking-tight whitespace-nowrap">
                <span class="text-[#E8000C] text-xl mr-1">AI</span>
                <span class="text-black text-xl">WorkMate</span>
            </div>
        </div>

        <!-- Main Navigation -->
        <nav class="flex-1 py-4 px-3 space-y-1">
            <a href="#" class="flex items-center px-3 py-2 text-sm font-medium text-gray-600 hover:bg-gray-50 rounded-md">
                <svg class="mr-3 h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                </svg>
                Team
            </a>
            <a href="#" class="flex items-center px-3 py-2 text-sm font-medium bg-red-50 text-red-600 rounded-md">
                <svg class="mr-3 h-5 w-5 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                Settings
            </a>
            
            <!-- Secondary Navigation -->
            <div class="mt-4 px-2 space-y-1">
                <a href="#" class="flex items-center px-3 py-2 text-sm font-medium text-gray-600 hover:bg-gray-50 rounded-md">
                    <svg class="mr-3 h-4 w-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                    Workforce Management
                </a>
                <a href="#" class="flex items-center px-3 py-2 text-sm font-medium bg-gray-100 text-gray-900 rounded-md shadow-sm">
                    <svg class="mr-3 h-4 w-4 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>
                    Toolset Management
                </a>
            </div>
        </nav>

        <!-- User Profile -->
        <div class="p-4 border-t border-gray-200 flex-shrink-0">
            <div class="flex items-center">
                <div class="h-8 w-8 rounded-full bg-purple-200 flex items-center justify-center overflow-hidden">
                    <svg class="h-6 w-6 text-purple-600 mt-2" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M24 20.993V24H0v-2.996A14.977 14.977 0 0112.004 15c4.904 0 9.26 2.354 11.996 5.993zM16.002 8.999a4 4 0 11-8 0 4 4 0 018 0z" />
                    </svg>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col min-w-0 overflow-hidden">
        
        <!-- Header -->
        <header class="h-16 flex items-center justify-between px-8 bg-white border-b border-gray-200 flex-shrink-0">
            <h1 class="text-xl font-semibold text-gray-800">Toolset Management</h1>
            <button class="bg-[#E8000C] hover:bg-[#CC000A] text-white text-sm font-medium py-2 px-4 rounded-md transition-colors flex items-center shadow-sm">
                <span class="mr-1 text-lg leading-none">+</span> New Toolset
            </button>
        </header>

        <!-- Content Area -->
        <div class="flex-1 overflow-auto p-8">
            
            <div class="mb-4 flex items-center text-sm font-medium text-gray-600 hover:text-gray-900 cursor-pointer">
                <svg class="w-4 h-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
                Update Toolset
            </div>

            <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-6 mb-6">
                
                <form>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                        <!-- Name Field -->
                        <div>
                            <label class="block text-[13px] font-semibold text-gray-700 mb-1.5 flex items-center">
                                Name <span class="text-red-500 ml-1">*</span>
                            </label>
                            <input type="text" value="planner" class="w-full px-3 py-2 bg-white border border-gray-200 rounded-md text-sm text-gray-900 focus:outline-none focus:ring-1 focus:ring-red-500 focus:border-red-500">
                        </div>

                        <!-- Version Field -->
                        <div>
                            <label class="block text-[13px] font-semibold text-gray-700 mb-1.5 flex items-center">
                                Version <span class="text-red-500 ml-1">*</span>
                            </label>
                            <input type="text" value="1.0.0" class="w-full px-3 py-2 bg-white border border-gray-200 rounded-md text-sm text-gray-900 focus:outline-none focus:ring-1 focus:ring-red-500 focus:border-red-500">
                        </div>
                    </div>

                    <!-- Description Field -->
                    <div class="mb-6">
                        <label class="block text-[13px] font-semibold text-gray-700 mb-1.5 flex items-center">
                            Description <span class="text-red-500 ml-1">*</span>
                        </label>
                        <textarea rows="3" class="w-full px-3 py-2 bg-white border border-gray-200 rounded-md text-sm text-gray-900 focus:outline-none focus:ring-1 focus:ring-red-500 focus:border-red-500 resize-none">任务规划助手</textarea>
                    </div>

                    <!-- 3 Column Grid -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                        <!-- Source Type -->
                        <div>
                            <label class="block text-[13px] font-semibold text-gray-700 mb-1.5 flex items-center">
                                Source Type <span class="text-red-500 ml-1">*</span>
                            </label>
                            <div class="relative">
                                <select class="w-full px-3 py-2 bg-white border border-gray-200 rounded-md text-sm text-gray-900 appearance-none focus:outline-none focus:ring-1 focus:ring-red-500 focus:border-red-500">
                                    <option>MCP</option>
                                </select>
                                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-500">
                                    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
                                </div>
                            </div>
                        </div>

                        <!-- Transport -->
                        <div>
                            <label class="block text-[13px] font-semibold text-gray-700 mb-1.5 flex items-center">
                                Transport <span class="text-red-500 ml-1">*</span>
                            </label>
                            <div class="relative">
                                <select class="w-full px-3 py-2 bg-white border border-gray-200 rounded-md text-sm text-gray-900 appearance-none focus:outline-none focus:ring-1 focus:ring-red-500 focus:border-red-500">
                                    <option>HTTP</option>
                                </select>
                                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-500">
                                    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
                                </div>
                            </div>
                        </div>

                        <!-- Domain -->
                        <div>
                            <label class="block text-[13px] font-semibold text-gray-700 mb-1.5 flex items-center">
                                Domain <span class="text-red-500 ml-1">*</span>
                            </label>
                            <div class="relative">
                                <select class="w-full px-3 py-2 bg-white border border-gray-200 rounded-md text-sm text-gray-900 appearance-none focus:outline-none focus:ring-1 focus:ring-red-500 focus:border-red-500">
                                    <option>Web Crawl</option>
                                </select>
                                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-500">
                                    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Core Toolset Toggle -->
                    <div class="mb-6 flex items-center">
                        <div class="w-10 h-5 bg-red-500 rounded-full flex items-center p-0.5 cursor-pointer">
                            <div class="bg-white w-4 h-4 rounded-full shadow-md transform translate-x-5 transition-transform duration-200"></div>
                        </div>
                        <span class="ml-3 text-sm font-medium text-gray-700">Core Toolset</span>
                    </div>

                    <!-- Icon URL Field -->
                    <div class="mb-6">
                        <label class="block text-[13px] font-semibold text-gray-700 mb-1.5">
                            Icon URL
                        </label>
                        <input type="text" placeholder="Icon URL (optional)" class="w-full px-3 py-2 bg-white border border-gray-200 rounded-md text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-red-500 focus:border-red-500">
                    </div>

                    <!-- Config JSON Field -->
                    <div class="mb-2">
                        <label class="block text-[13px] font-semibold text-gray-700 mb-1.5">
                            Config JSON
                        </label>
                        <textarea rows="3" placeholder='Config JSON (optional, e.g. {"key": "value"})' class="w-full px-3 py-2 bg-white border border-gray-200 rounded-md text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-red-500 focus:border-red-500 font-mono resize-none"></textarea>
                    </div>

                </form>
            </div>

            <!-- Action Buttons -->
            <div class="flex items-center space-x-3">
                <button class="bg-[#E8000C] hover:bg-[#CC000A] text-white text-sm font-medium py-2 px-5 rounded-md transition-colors flex items-center shadow-sm">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
                    Update
                </button>
                <button class="bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 text-sm font-medium py-2 px-5 rounded-md transition-colors flex items-center shadow-sm">
                    <svg class="w-4 h-4 mr-2 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"></path></svg>
                    Cancel
                </button>
            </div>

        </div>
    </main>

</body>
</html>
