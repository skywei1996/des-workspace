<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silicon WorkMate - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #FAFAFA;
        }
    </style>
</head>
<body class="h-screen flex overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-[200px] bg-white border-r border-gray-200 flex flex-col flex-shrink-0">
        <!-- Logo -->
        <div class="h-16 flex items-center px-6 border-b border-gray-100">
            <div class="flex items-center font-extrabold tracking-tight whitespace-nowrap">
                <span class="text-[#E8000C] text-xl mr-1">AI</span>
                <span class="text-black text-xl">WorkMate</span>
            </div>
        </div>

        <!-- Main Navigation -->
        <nav class="flex-1 py-4 px-3 space-y-1">
            <a href="#" class="flex items-center px-3 py-2 text-sm font-medium bg-gray-100 text-gray-900 rounded-md">
                <svg class="mr-3 h-5 w-5 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                </svg>
                Team
            </a>
            <a href="#" class="flex items-center px-3 py-2 text-sm font-medium text-gray-600 hover:bg-gray-50 rounded-md">
                <svg class="mr-3 h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                Settings
            </a>
        </nav>

        <!-- User Profile -->
        <div class="p-4 border-t border-gray-200">
            <div class="flex items-center">
                <div class="h-8 w-8 rounded-full bg-purple-200 flex items-center justify-center overflow-hidden">
                    <!-- Placeholder avatar -->
                    <svg class="h-6 w-6 text-purple-600 mt-2" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M24 20.993V24H0v-2.996A14.977 14.977 0 0112.004 15c4.904 0 9.26 2.354 11.996 5.993zM16.002 8.999a4 4 0 11-8 0 4 4 0 018 0z" />
                    </svg>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col min-w-0 overflow-hidden">
        
        <!-- Header -->
        <header class="h-16 flex items-center justify-between px-8 bg-white border-b border-gray-200 flex-shrink-0">
            <h1 class="text-xl font-semibold text-gray-800">Silicon WorkMate</h1>
            <button class="bg-[#E8000C] hover:bg-[#CC000A] text-white text-sm font-medium py-2 px-4 rounded-md transition-colors flex items-center">
                <span class="mr-1 text-lg leading-none">+</span> New Silicon Worker
            </button>
        </header>

        <!-- Toolbar -->
        <div class="px-8 py-5 flex items-center justify-between flex-shrink-0">
            
            <!-- Filters -->
            <div class="flex items-center space-x-1 bg-gray-100 p-1 rounded-lg">
                <button class="px-4 py-1.5 text-sm font-medium bg-white text-gray-900 rounded-md shadow-sm">All</button>
                <button class="px-4 py-1.5 text-sm font-medium text-gray-500 hover:text-gray-700">测试</button>
                <button class="px-4 py-1.5 text-sm font-medium text-gray-500 hover:text-gray-700">HR</button>
                <button class="px-4 py-1.5 text-sm font-medium text-gray-500 hover:text-gray-700">12</button>
                <button class="px-4 py-1.5 text-sm font-medium text-gray-500 hover:text-gray-700">市场营销</button>
            </div>

            <div class="flex items-center space-x-3">
                <!-- Dropdown 1 -->
                <select class="bg-white border border-gray-200 text-gray-700 text-sm rounded-md px-3 py-2 focus:outline-none focus:ring-1 focus:ring-red-500 cursor-pointer outline-none">
                    <option>All Workers</option>
                </select>
                <!-- Dropdown 2 -->
                <select class="bg-white border border-gray-200 text-gray-700 text-sm rounded-md px-3 py-2 focus:outline-none focus:ring-1 focus:ring-red-500 cursor-pointer outline-none">
                    <option>All Status</option>
                </select>

                <!-- Search -->
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-4 w-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                    </div>
                    <input type="text" class="block w-64 pl-10 pr-3 py-2 border border-gray-200 rounded-md leading-5 bg-white placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-red-500 focus:border-red-500 sm:text-sm" placeholder="Search Silicon Workers">
                </div>
            </div>
        </div>

        <!-- Worker Grid -->
        <div class="flex-1 overflow-auto px-8 pb-8">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                
                <!-- Worker Card 1 -->
                <div class="bg-white rounded-xl border border-gray-100 shadow-[0_2px_10px_rgb(0,0,0,0.02)] p-5 cursor-pointer hover:shadow-md transition-shadow">
                    <div class="h-10 w-10 rounded-full bg-purple-100 flex items-center justify-center overflow-hidden mb-4">
                        <svg class="h-8 w-8 text-purple-600 mt-2" fill="currentColor" viewBox="0 0 24 24"><path d="M24 20.993V24H0v-2.996A14.977 14.977 0 0112.004 15c4.904 0 9.26 2.354 11.996 5.993zM16.002 8.999a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
                    </div>
                    <h3 class="text-base font-bold text-gray-900 mb-1">API架构设计助手</h3>
                    <p class="text-sm text-gray-500 mb-4 line-clamp-2 h-10">专业的API设计和架构顾问，提供RESTful、GraphQL等API设计最佳实践</p>
                    <div class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-green-50 text-green-700">
                        <span class="w-1.5 h-1.5 rounded-full bg-green-500 mr-1.5"></span>
                        Active
                    </div>
                </div>

                <!-- Worker Card 2 -->
                <div class="bg-white rounded-xl border border-gray-100 shadow-[0_2px_10px_rgb(0,0,0,0.02)] p-5 cursor-pointer hover:shadow-md transition-shadow">
                    <div class="h-10 w-10 rounded-full bg-purple-100 flex items-center justify-center overflow-hidden mb-4">
                        <svg class="h-8 w-8 text-purple-600 mt-2" fill="currentColor" viewBox="0 0 24 24"><path d="M24 20.993V24H0v-2.996A14.977 14.977 0 0112.004 15c4.904 0 9.26 2.354 11.996 5.993zM16.002 8.999a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
                    </div>
                    <h3 class="text-base font-bold text-gray-900 mb-1">T02</h3>
                    <p class="text-sm text-gray-500 mb-4 h-10">测试</p>
                    <div class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-green-50 text-green-700">
                        <span class="w-1.5 h-1.5 rounded-full bg-green-500 mr-1.5"></span>
                        Active
                    </div>
                </div>

                <!-- Worker Card 3 -->
                <div class="bg-white rounded-xl border border-gray-100 shadow-[0_2px_10px_rgb(0,0,0,0.02)] p-5 cursor-pointer hover:shadow-md transition-shadow">
                    <div class="h-10 w-10 rounded-full bg-purple-100 flex items-center justify-center overflow-hidden mb-4">
                        <svg class="h-8 w-8 text-purple-600 mt-2" fill="currentColor" viewBox="0 0 24 24"><path d="M24 20.993V24H0v-2.996A14.977 14.977 0 0112.004 15c4.904 0 9.26 2.354 11.996 5.993zM16.002 8.999a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
                    </div>
                    <h3 class="text-base font-bold text-gray-900 mb-1">T01</h3>
                    <p class="text-sm text-gray-500 mb-4 h-10">测试</p>
                    <div class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-green-50 text-green-700">
                        <span class="w-1.5 h-1.5 rounded-full bg-green-500 mr-1.5"></span>
                        Active
                    </div>
                </div>

                <!-- Worker Card 4 -->
                <div class="bg-white rounded-xl border border-gray-100 shadow-[0_2px_10px_rgb(0,0,0,0.02)] p-5 cursor-pointer hover:shadow-md transition-shadow">
                    <div class="h-10 w-10 rounded-full bg-purple-100 flex items-center justify-center overflow-hidden mb-4">
                        <svg class="h-8 w-8 text-purple-600 mt-2" fill="currentColor" viewBox="0 0 24 24"><path d="M24 20.993V24H0v-2.996A14.977 14.977 0 0112.004 15c4.904 0 9.26 2.354 11.996 5.993zM16.002 8.999a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
                    </div>
                    <h3 class="text-base font-bold text-gray-900 mb-1">测试员工06</h3>
                    <p class="text-sm text-gray-500 mb-4 h-10">测试</p>
                    <div class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-green-50 text-green-700">
                        <span class="w-1.5 h-1.5 rounded-full bg-green-500 mr-1.5"></span>
                        Active
                    </div>
                </div>

            </div>
        </div>
    </main>

</body>
</html>
