<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - AI WorkMate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 模拟原图那种微渐变的浅色高级背景 */
        body {
            background: linear-gradient(135deg, #fdfdfd 0%, #f0f2f5 50%, #e8e9eb 100%);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center relative">

    <!-- 左上角 Logo 区域 -->
    <div class="absolute top-8 left-8">
        <div class="flex items-center font-extrabold tracking-tight whitespace-nowrap">
            <span class="text-[#E8000C] text-3xl mr-1">AI</span>
            <span class="text-black text-3xl">WorkMate</span>
        </div>
    </div>

    <!-- 居中登录卡片 -->
    <div class="bg-white p-10 rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] w-full max-w-[420px]">
        <h2 class="text-2xl font-normal text-gray-800 mb-2">Sign in</h2>
        <p class="text-gray-500 text-sm mb-8">Sign in to your account to continue</p>

        <form>
            <!-- 账号输入框 -->
            <div class="mb-5">
                <label class="block text-gray-800 text-xs font-bold mb-2" for="username">
                    Email Address*
                </label>
                <input class="w-full px-4 py-2.5 bg-gray-50/50 border border-gray-200 rounded-md text-sm focus:outline-none focus:border-red-500 focus:bg-white transition-colors placeholder-gray-400" 
                       id="username" 
                       type="text" 
                       placeholder="Enter username">
            </div>

            <!-- 密码输入框 -->
            <div class="mb-8">
                <label class="block text-gray-800 text-xs font-bold mb-2" for="password">
                    Password*
                </label>
                <input class="w-full px-4 py-2.5 bg-gray-50/50 border border-gray-200 rounded-md text-sm focus:outline-none focus:border-red-500 focus:bg-white transition-colors placeholder-gray-400" 
                       id="password" 
                       type="password" 
                       placeholder="Enter password">
            </div>

            <!-- 登录按钮 -->
            <button class="w-full bg-[#E8000C] hover:bg-[#CC000A] text-white text-sm font-medium py-3 px-4 rounded-full transition-colors" 
                    type="button">
                Continue
            </button>
        </form>
    </div>

</body>
</html>
