<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silicon WorkMate - Toolset Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #FAFAFA;
        }
    </style>
</head>
<body class="h-screen flex overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-[200px] bg-white border-r border-gray-200 flex flex-col flex-shrink-0">
        <!-- Logo -->
        <div class="h-16 flex items-center px-6 border-b border-gray-100 flex-shrink-0">
            <div class="flex items-center font-extrabold tracking-tight whitespace-nowrap">
                <span class="text-[#E8000C] text-xl mr-1">AI</span>
                <span class="text-black text-xl">WorkMate</span>
            </div>
        </div>

        <!-- Main Navigation -->
        <nav class="flex-1 py-4 px-3 space-y-1">
            <a href="#" class="flex items-center px-3 py-2 text-sm font-medium text-gray-600 hover:bg-gray-50 rounded-md">
                <svg class="mr-3 h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                </svg>
                Team
            </a>
            <a href="#" class="flex items-center px-3 py-2 text-sm font-medium bg-red-50 text-red-600 rounded-md">
                <svg class="mr-3 h-5 w-5 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                Settings
            </a>
            
            <!-- Secondary Navigation -->
            <div class="mt-4 px-2 space-y-1">
                <a href="#" class="flex items-center px-3 py-2 text-sm font-medium text-gray-600 hover:bg-gray-50 rounded-md">
                    <svg class="mr-3 h-4 w-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                    Workforce Management
                </a>
                <a href="#" class="flex items-center px-3 py-2 text-sm font-medium bg-gray-100 text-gray-900 rounded-md shadow-sm">
                    <svg class="mr-3 h-4 w-4 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>
                    Toolset Management
                </a>
            </div>
        </nav>

        <!-- User Profile -->
        <div class="p-4 border-t border-gray-200 flex-shrink-0">
            <div class="flex items-center">
                <div class="h-8 w-8 rounded-full bg-purple-200 flex items-center justify-center overflow-hidden">
                    <svg class="h-6 w-6 text-purple-600 mt-2" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M24 20.993V24H0v-2.996A14.977 14.977 0 0112.004 15c4.904 0 9.26 2.354 11.996 5.993zM16.002 8.999a4 4 0 11-8 0 4 4 0 018 0z" />
                    </svg>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col min-w-0 overflow-hidden">
        
        <!-- Header -->
        <header class="h-16 flex items-center justify-between px-8 bg-white border-b border-gray-200 flex-shrink-0">
            <h1 class="text-xl font-semibold text-gray-800">Toolset Management</h1>
            <button class="bg-[#E8000C] hover:bg-[#CC000A] text-white text-sm font-medium py-2 px-4 rounded-md transition-colors flex items-center">
                <span class="mr-1 text-lg leading-none">+</span> New Toolset
            </button>
        </header>

        <!-- Content Area -->
        <div class="flex-1 overflow-auto p-8">
            <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
                
                <!-- Filters Toolbar -->
                <div class="p-4 border-b border-gray-200 flex items-center space-x-3 bg-white">
                    <!-- Dropdown 1 -->
                    <div class="relative">
                        <button class="bg-white border border-gray-200 text-gray-600 text-sm rounded-md px-3 py-2 focus:outline-none flex items-center justify-between w-40">
                            All Source Types
                            <svg class="h-4 w-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
                        </button>
                    </div>

                    <!-- Dropdown 2 -->
                    <div class="relative">
                        <button class="bg-white border border-gray-200 text-gray-600 text-sm rounded-md px-3 py-2 focus:outline-none flex items-center justify-between w-44">
                            All Transport Types
                            <svg class="h-4 w-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
                        </button>
                    </div>

                    <!-- Dropdown 3 -->
                    <div class="relative flex items-center border border-gray-200 rounded-md bg-white">
                        <span class="pl-3 py-2 text-sm text-gray-500 bg-gray-50 border-r border-gray-200 rounded-l-md">All Domains</span>
                        <button class="text-gray-600 text-sm px-3 py-2 focus:outline-none flex items-center justify-between w-24">
                            All
                            <svg class="h-4 w-4 text-gray-400 ml-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
                        </button>
                    </div>

                    <!-- Search Input -->
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-4 w-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                            </svg>
                        </div>
                        <input type="text" class="block w-64 pl-9 pr-3 py-2 border border-gray-200 rounded-md leading-5 bg-white placeholder-gray-400 focus:outline-none sm:text-sm" placeholder="Search toolsets">
                    </div>

                    <!-- Reset Button -->
                    <button class="flex items-center text-sm font-medium text-gray-600 hover:text-gray-900 px-3 py-2 rounded-md hover:bg-gray-50 transition-colors">
                        <svg class="h-4 w-4 mr-1.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                        Reset
                    </button>
                </div>

                <!-- Table -->
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y border-b border-gray-200">
                        <thead class="bg-white">
                            <tr>
                                <th scope="col" class="px-6 py-4 text-left text-[11px] font-bold text-gray-500 uppercase tracking-wider w-1/5">NAME</th>
                                <th scope="col" class="px-6 py-4 text-left text-[11px] font-bold text-gray-500 uppercase tracking-wider w-1/6">VERSION</th>
                                <th scope="col" class="px-6 py-4 text-left text-[11px] font-bold text-gray-500 uppercase tracking-wider w-1/6">SOURCE</th>
                                <th scope="col" class="px-6 py-4 text-left text-[11px] font-bold text-gray-500 uppercase tracking-wider w-1/6">TRANSPORT</th>
                                <th scope="col" class="px-6 py-4 text-left text-[11px] font-bold text-gray-500 uppercase tracking-wider w-1/6">DOMAIN</th>
                                <th scope="col" class="px-6 py-4 text-left text-[11px] font-bold text-gray-500 uppercase tracking-wider">CORE</th>
                                <th scope="col" class="px-6 py-4 text-left text-[11px] font-bold text-gray-500 uppercase tracking-wider">CREATED</th>
                                <th scope="col" class="px-6 py-4 text-center text-[11px] font-bold text-gray-500 uppercase tracking-wider">ACTIONS</th>
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-100">
                            <!-- Row 1 -->
                            <tr class="hover:bg-gray-50 transition-colors">
                                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-700">browser</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">1.0.0</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">builtin</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">-</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">Code</td>
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <span class="px-2 py-0.5 inline-flex text-xs leading-5 font-semibold rounded bg-red-600 text-white">Core</span>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">2026/1/29</td>
                                <td class="px-6 py-4 whitespace-nowrap text-center text-sm font-medium">
                                    <button class="text-gray-400 hover:text-gray-600">
                                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M6 10a2 2 0 11-4 0 2 2 0 014 0zM12 10a2 2 0 11-4 0 2 2 0 014 0zM16 12a2 2 0 100-4 2 2 0 000 4z" /></svg>
                                    </button>
                                </td>
                            </tr>
                            <!-- Row 2 -->
                            <tr class="hover:bg-gray-50 transition-colors">
                                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-700">planner</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">1.0.0</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">mcp</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">http</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">Web Crawl</td>
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <span class="px-2 py-0.5 inline-flex text-xs leading-5 font-semibold rounded bg-red-600 text-white">Core</span>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">2026/2/23</td>
                                <td class="px-6 py-4 whitespace-nowrap text-center text-sm font-medium">
                                    <button class="text-gray-400 hover:text-gray-600">
                                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M6 10a2 2 0 11-4 0 2 2 0 014 0zM12 10a2 2 0 11-4 0 2 2 0 014 0zM16 12a2 2 0 100-4 2 2 0 000 4z" /></svg>
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination Footer -->
                <div class="bg-white px-6 py-4 flex items-center justify-between">
                    <div class="text-sm text-gray-500 font-medium">
                        Total 2 Records
                    </div>
                    <div class="flex items-center space-x-2">
                        <button class="p-1 border border-gray-200 rounded text-gray-400 cursor-not-allowed bg-gray-50">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7" /></svg>
                        </button>
                        <button class="p-1 border border-gray-200 rounded text-gray-400 cursor-not-allowed bg-gray-50">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
                        </button>
                        <span class="text-sm text-gray-600 mx-2">Page 1 of 1</span>
                        <button class="p-1 border border-gray-200 rounded text-gray-400 cursor-not-allowed bg-gray-50">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
                        </button>
                        <button class="p-1 border border-gray-200 rounded text-gray-400 cursor-not-allowed bg-gray-50">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7" /></svg>
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </main>

</body>
</html>
